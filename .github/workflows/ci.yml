name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["v*"] # tags are built by release.yml
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC: the long measurement harnesses
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: Lint (fmt, clippy, rustdoc, versions)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # ALSA for cpal/midir; GTK/WebKitGTK/libsoup for Tauri 2 (cricket_gui is in --workspace).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11)
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: thumbv8m.main-none-eabihf

      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (cricket_core, no_std)
        run: cargo clippy -p cricket_core --no-default-features --target thumbv8m.main-none-eabihf -- -D warnings

      - name: Rustdoc (warnings are errors)
        run: cargo doc --no-deps --workspace --exclude cricket_gui
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Versions agree (Cargo.toml, tauri.conf.json, package.json)
        run: .github/scripts/check-versions.sh

  test:
    name: Test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1

      # Linux also builds and tests the GUI crate (the Tauri deps are installed above).
      - name: Test (workspace, including cricket_gui)
        if: runner.os == 'Linux'
        run: cargo test --workspace

      - name: Test (workspace without cricket_gui)
        if: runner.os != 'Linux'
        run: cargo test --workspace --exclude cricket_gui

  no_std:
    name: cricket_core no_std (${{ matrix.target }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv8m.main-none-eabihf # Cortex-M33 (RP2350, STM32H5/U5)
          - thumbv6m-none-eabi # Cortex-M0+ (RP2040), no hardware float
          - riscv32imac-unknown-none-elf # ESP32-C series, RP2350 RISC-V cores
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1

      - name: Build for a bare-metal target
        run: cargo build -p cricket_core --no-default-features --target ${{ matrix.target }} --release

  msrv:
    name: MSRV (Rust 1.87)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11)
        with:
          toolchain: "1.87.0" # keep equal to rust-version in Cargo.toml

      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1

      - name: Check with the minimum supported Rust version
        run: cargo check -p cricket_core -p cricket_engine -p cricket_cli

  gui:
    name: GUI (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cricket_gui
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: cricket_gui/package-lock.json

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Check the Tauri crate
        run: cargo check -p cricket_gui

  supply-chain:
    name: Supply chain (cargo deny, cargo audit)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # audit-check posts its findings as a check run, which needs checks: write.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: cargo deny (licenses, advisories, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@44db170f6a7d12a6e90340e9e0fca1f650d34b14 # v2.0.15
        with:
          command: check
          arguments: --all-features

      - name: cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Same accepted advisories as deny.toml, with the reasons there.
          ignore: RUSTSEC-2026-0293,RUSTSEC-2026-0194,RUSTSEC-2026-0195

  # The 15 `#[ignore]`d measurement harnesses: A/B tables, false-accept and chord
  # reports. Too slow for every push; weekly (or on demand) in release mode, one
  # job per test binary so a slow table does not hide the others.
  harnesses:
    name: Measurement harnesses (${{ matrix.test }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        test:
          - fec # fec_ab_table, acquisition_ab_table, false_trigger_report
          - fec_false_accept # false_accept_report
          - phy_ab_measurements # ab_report, bmc_param_sweep
          - ltc_fast_ab # ltc_fast_ab_table, ltc_fast_phy_diag, ltc_fast_chord_table, ltc_fast_cpu
          - ltc_fec_ab # ltc_fec_ab_table, ltc_false_message_report
          - stuck_notes # ltc_back_to_back_report
          - search_load # search_load_report
          - digital # digital_report
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          key: harnesses

      - name: Run the ignored tests of one harness (release)
        run: |
          mkdir -p harness-out
          cargo test --release -p cricket_core --test ${{ matrix.test }} -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee "harness-out/${{ matrix.test }}.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harness-${{ matrix.test }}
          path: harness-out/
          retention-days: 90

  # The cargo-fuzz targets (cricket_core/fuzz): nightly + libFuzzer, so not on
  # every push; weekly (or on demand), ten minutes per target, one job each.
  # A crash input is uploaded as an artifact; reproduce it as CONTRIBUTING.md
  # describes.
  fuzz:
    name: Fuzz (${{ matrix.target }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - decode_packet_bytes
          - fec_decode_body
          - rs16_decode
          - msc_parse_sysex
          - midi_input
          - from_name
          - rx_mfsk_stream
          - rx_bmc_stream
          - rx_digital_stream
          - modem_rx_stream
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11)
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          key: fuzz
          workspaces: cricket_core/fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz for ten minutes
        working-directory: cricket_core/fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600 -rss_limit_mb=2048

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: cricket_core/fuzz/artifacts/
          retention-days: 90
