[package]
name = "cricket_cli"
description = "Cricket command-line front end: MIDI over audio (AML v1) encoder, decoder, loopback measurement and path check"
readme = "../README.md"
keywords = ["midi", "audio", "modem", "msc", "cli"]
categories = ["multimedia::audio", "command-line-utilities"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[[bin]]
name = "cricket"
path = "src/main.rs"

[dependencies]
cricket_core = { path = "../cricket_core", version = "0.2.0" }
cricket_sim = { path = "../cricket_sim", version = "0.2.0" }
cricket_engine = { path = "../cricket_engine", version = "0.2.0" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
ctrlc = "3"
serde_json = "1"
