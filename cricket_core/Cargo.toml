[package]
name = "cricket_core"
description = "AML v1 MIDI-over-audio modem: tones, LTC-style line code, packets, CRC, Reed-Solomon FEC, TX scheduler and fail-safe (no_std + alloc)"
readme = "../README.md"
keywords = ["midi", "audio", "modem", "msc", "no-std"]
categories = ["multimedia::audio", "no-std", "embedded", "encoding"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
# WAV file I/O and the legacy prototype phy. Without it the crate is `no_std` + `alloc`.
std = ["dep:hound", "dep:serde", "dep:serde_json"]

[dependencies]
libm = "0.2"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
hound = { version = "3.5", optional = true }

[dev-dependencies]
tempfile = "3"
